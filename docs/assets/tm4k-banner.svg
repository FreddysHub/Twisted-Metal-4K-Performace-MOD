<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">TM4K — Twisted Metal 4K Performance Mod</title>
  <desc id="desc">Independent fan project by FreddysHub. Dark steel, red accents and a perspective road grid.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#080a0e"/></linearGradient>
    <linearGradient id="red"><stop stop-color="#ff464c"/><stop offset="1" stop-color="#ac171f"/></linearGradient>
    <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dce2e9"/><stop offset=".51" stop-color="#909ca9"/><stop offset="1" stop-color="#f0f3f7"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a51b28" stop-opacity=".32"/><stop offset="1" stop-color="#a51b28" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="390" rx="18" fill="url(#bg)"/>
  <ellipse cx="1065" cy="220" rx="340" ry="290" fill="url(#glow)"/>
  <g stroke="#cc2834" opacity=".19" fill="none">
    <path d="M800 390L1000 165 1220 390M675 390L1000 165 1280 312M945 390L1000 165 1070 390"/>
    <path d="M820 350H1260M850 310H1210M890 270H1160M925 230H1120M960 195H1060"/>
  </g>
  <path d="M48 48H116L104 55H48Z" fill="url(#red)"/>
  <text x="48" y="90" fill="#e3e9ef" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="5">FREDDYSHUB / COMMUNITY MODDING</text>
  <text x="44" y="206" fill="url(#steel)" font-family="Arial Black,Segoe UI,Arial,sans-serif" font-weight="900" font-size="113" letter-spacing="-7">TM<tspan fill="url(#red)">4K</tspan></text>
  <text x="52" y="255" fill="#f0f3f7" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="28" letter-spacing="3">TWISTED METAL</text>
  <text x="53" y="291" fill="#9ba8b7" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="3">4K PERFORMANCE MOD</text>
  <path d="M52 322H594" stroke="#38424f"/>
  <text x="53" y="352" fill="#aeb8c5" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.2">RPCS3 / VULKAN / SOURCE + BUILD GUIDE</text>
  <g transform="translate(918 73)" fill="#eaeef3" font-family="Segoe UI,Arial,sans-serif">
    <rect width="292" height="70" rx="6" fill="#161d27" stroke="#3c4856"/>
    <text x="22" y="28" font-size="12" letter-spacing="2" fill="#a4b0bf">REFERENCE OUTPUT</text>
    <text x="22" y="55" font-size="24" font-weight="700">3840 × 2160</text>
    <rect y="85" width="292" height="70" rx="6" fill="#161d27" stroke="#3c4856"/>
    <text x="22" y="113" font-size="12" letter-spacing="2" fill="#a4b0bf">FRAME-RATE TARGET</text>
    <text x="22" y="140" font-size="24" font-weight="700">UP TO 60 FPS</text>
    <text x="1" y="229" font-size="12" letter-spacing="1" fill="#8391a1">INDEPENDENT FAN PROJECT</text>
    <text x="1" y="251" font-size="12" fill="#8391a1">Not affiliated with Sony or RPCS3.</text>
  </g>
  <path d="M0 384H1280" stroke="url(#red)" stroke-width="6"/>
</svg>
